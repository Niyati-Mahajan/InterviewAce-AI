<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InterviewAce AI | Register</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="{{ url_for('home') }}">
        <span class="brand-mark">IA</span>
        <span>InterviewAce AI</span>
      </a>
      <nav class="nav">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('login') }}">Login</a>
      </nav>
    </header>

    <main class="auth-layout">
      <section class="auth-card">
        <div class="auth-header">
          <h1>Register</h1>
          <p>Create your student profile.</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-list">
              {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        <form class="form-panel form-stack" method="post" action="{{ url_for('register') }}">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Niyati" required>
          </div>
          <div class="field">
            <label for="college">College</label>
            <input id="college" name="college" type="text" placeholder="Your college name" required>
          </div>
          <div class="field">
            <label for="branch">Branch</label>
            <input id="branch" name="branch" type="text" placeholder="Computer Science" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="niyati@example.com" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Create password" required>
          </div>
          <button class="full-width" type="submit">Register</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
